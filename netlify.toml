# Netlify deployment configuration for TechXplain.
#
# TechXplain is a static frontend: React + Vite, no backend, no serverless
# functions, no environment variables, nothing to keep secret.
#
# The app uses HashRouter, so its own URLs look like /#/concept/api. A clean
# path such as /concept/api is not a file in the build output, so it is handed
# to the matching hash route with a temporary redirect. Every other unknown
# path falls back to index.html, where the app renders its own NotFound screen.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/concept/*"
  to = "/index.html#/concept/:splat"
  status = 302

[[redirects]]
  from = "/category/*"
  to = "/index.html#/category/:splat"
  status = 302

[[redirects]]
  from = "/explore"
  to = "/index.html#/explore"
  status = 302

[[redirects]]
  from = "/categories"
  to = "/index.html#/categories"
  status = 302

# Any other unknown path gets the app, which then shows its own NotFound page.
# This must be the last rule.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
